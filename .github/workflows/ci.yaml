name: ci

on:
  push:
    branches: [ "23-github-ci-setup" ]
  #pull_request:
  #  branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Wails Build Check
        uses: dAppServer/wails-build-action@v2
        with:
          install-go: false
          install-node: false
          build-platform: linux/amd64
          package: false 
      - name: Run Go Tests
        run: go test -v ./...
