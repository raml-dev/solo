name: Cross-platform Build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag_meta.outputs.prerelease }}
      make_latest: ${{ steps.tag_meta.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect release channel from tag
        id: tag_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require notes for stable tags
        if: steps.tag_meta.outputs.prerelease != 'true'
        shell: bash
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "ERROR: Missing release notes for stable tag: $NOTES_FILE"
            exit 1
          fi
  build:
    needs: [validate]
    if: needs.validate.outputs.make_latest == 'true' || needs.validate.outputs.prerelease == 'true'
    env:
      MISE_ENV: ci
      UPDATE_ENDPOINT: ${{ vars.UPDATE_ENDPOINT }}
      UPDATE_KID: ${{ secrets.UPDATE_KID }}
      UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        build: [
          { name: "solo-windows-amd64.exe", platform: windows/amd64, os: windows-2025 },
          { name: "solo-windows-arm64.exe", platform: windows/arm64, os: windows-11-arm },
          { name: "solo-linux-amd64", platform: linux/amd64, os: ubuntu-24.04 },
          { name: "solo-linux-arm64", platform: linux/arm64, os: ubuntu-24.04-arm },
          { name: "solo-darwin-amd64.dmg", platform: darwin/amd64, os: macos-26-intel },
          { name: "solo-darwin-arm64.dmg", platform: darwin/arm64, os: macos-26 }
        ]

    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.10"
      - name: Generate update config
        shell: bash
        run: mise run ci:be:gen-update-config
      - name: Inject version into wails.json
        uses: sergeysova/jq-action@v2
        with:
          cmd: |
            jq --arg v "$GITHUB_REF_NAME" '.info.productVersion = "\($v)"' \
              wails.json > wails.tmp.json && mv wails.tmp.json wails.json

      - uses: The-Egg-Corp/wails-build-action@v2.1
        with:
          name: solo
          build-name: ${{ startsWith(matrix.build.platform, 'darwin/') && 'solo' || matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          nsis: false
          package: false
          # TODO: versifyr
          go-version: 1.25.6
          # TODO: versifyr
          node-version: 24.12.0
          build-obfuscate: false
      - name: Create macOS DMG
        if: startsWith(matrix.build.platform, 'darwin/')
        shell: bash
        run: |
          APP_PATH="build/bin/solo.app"
          DMG_PATH="build/bin/${{ matrix.build.name }}"

          if [ ! -d "$APP_PATH" ]; then
            echo "Missing app bundle: $APP_PATH"
            ls -la build/bin || true
            exit 1
          fi

          # Sign nested frameworks/libs/binaries and the bundle itself
          codesign --force --deep --sign - "$APP_PATH"

          # Verify signature integrity
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          # print signing info for debugging
          codesign -dv --verbose=4 "$APP_PATH" || true

          hdiutil create \
            -volname "solo" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          echo "Created $DMG_PATH"
      - name: Upload matrix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build.name }}
          if-no-files-found: error
          path: |
            build/bin/${{ matrix.build.name }}
  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: needs.validate.outputs.make_latest == 'true' || needs.validate.outputs.prerelease == 'true'
    permissions:
     contents: write
     id-token: write
     attestations: write
     artifact-metadata: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_RC="${{ needs.validate.outputs.prerelease }}"

          if [ "$IS_RC" = "true" ]; then
            RC_NOTES="docs/releases/${TAG}.md"
            BASE_TAG="${TAG%-rc*}"   # 1.2.3-rc1 -> 1.2.3
            BASE_NOTES="docs/releases/${BASE_TAG}.md"

            if [ -f "$RC_NOTES" ]; then
              cp "$RC_NOTES" RELEASE_NOTES.md
              echo "Using RC-specific release notes: $RC_NOTES"
            elif [ -f "$BASE_NOTES" ]; then
              cp "$BASE_NOTES" RELEASE_NOTES.md
              echo "Using base release notes for RC: $BASE_NOTES"
            else
              echo "No release notes found for ${TAG} or ${BASE_TAG}; using fallback."
              echo "Pre-release ${TAG}" > RELEASE_NOTES.md
            fi
          else
            NOTES_FILE="docs/releases/${TAG}.md"
            cp "$NOTES_FILE" RELEASE_NOTES.md
            echo "Using stable release notes: $NOTES_FILE"
          fi
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      # TODO: uncomment when we switch to a public repo
      # - name: Attest release artifacts provenance
      #   uses: actions/attest@v4
      #   with:
      #     subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/**
          fail_on_unmatched_files: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.make_latest == 'true' }}
