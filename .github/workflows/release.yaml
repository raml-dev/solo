name: Cross-platform Build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag_meta.outputs.prerelease }}
      make_latest: ${{ steps.tag_meta.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect release channel from tag
        id: tag_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require notes for stable tags
        if: steps.tag_meta.outputs.prerelease != 'true'
        shell: bash
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "ERROR: Missing release notes for stable tag: $NOTES_FILE"
            exit 1
          fi
  build:
    needs: [validate]
    if: needs.validate.outputs.make_latest == 'true' || needs.validate.outputs.prerelease == 'true'
    env:
      MISE_ENV: ci
      SOLO_RELEASE_TAG: ${{ github.ref_name }}
      SOLO_RELEASE_VERSION: ${{ github.ref_name }}
      SOLO_RELEASE_CHANNEL: ${{ needs.validate.outputs.prerelease == 'true' && 'prerelease' || 'stable' }}
      SOLO_DIST_DIR: ${{ github.workspace }}/dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            artifact_name: solo-windows-amd64.exe
            runner: windows-2025
            build_tags: ""
            needs_linux_deps: false
          - target: windows-arm64
            artifact_name: solo-windows-arm64.exe
            runner: windows-11-arm
            build_tags: ""
            needs_linux_deps: false
          - target: linux-amd64
            artifact_name: solo-linux-amd64
            runner: ubuntu-24.04
            build_tags: webkit2_41
            needs_linux_deps: true
          - target: linux-arm64
            artifact_name: solo-linux-arm64
            runner: ubuntu-24.04-arm
            build_tags: webkit2_41
            needs_linux_deps: true
          - target: darwin-amd64
            artifact_name: solo-darwin-amd64.dmg
            runner: macos-26-intel
            build_tags: ""
            needs_linux_deps: false
          - target: darwin-arm64
            artifact_name: solo-darwin-arm64.dmg
            runner: macos-26
            build_tags: ""
            needs_linux_deps: false

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.10"
      - name: Install Linux build dependencies
        if: matrix.needs_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get -yq install libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Prepare release context
        run: mise run ci:rel:prepare
      - name: Build raw artifact
        env:
          SOLO_BUILD_TAGS: ${{ matrix.build_tags }}
        run: mise run ci:rel:build -- ${{ matrix.target }}
      - name: Upload matrix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: dist/${{ matrix.artifact_name }}
  package-linux:
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: needs.validate.outputs.make_latest == 'true' || needs.validate.outputs.prerelease == 'true'
    env:
      MISE_ENV: ci
      SOLO_RELEASE_TAG: ${{ github.ref_name }}
      SOLO_RELEASE_VERSION: ${{ github.ref_name }}
      SOLO_RELEASE_CHANNEL: ${{ needs.validate.outputs.prerelease == 'true' && 'prerelease' || 'stable' }}
      SOLO_DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.10"
      - name: Download Linux raw artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: solo-linux-*
          path: dist
          merge-multiple: true
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get -yq install rpm zstd
      - name: Build Linux package artifacts
        run: mise run ci:rel:package:linux
      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-package-artifacts
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
  release:
    needs: [validate, build, package-linux]
    runs-on: ubuntu-latest
    if: needs.validate.outputs.make_latest == 'true' || needs.validate.outputs.prerelease == 'true'
    env:
      MISE_ENV: ci
      SOLO_RELEASE_TAG: ${{ github.ref_name }}
      SOLO_RELEASE_VERSION: ${{ github.ref_name }}
      SOLO_RELEASE_CHANNEL: ${{ needs.validate.outputs.prerelease == 'true' && 'prerelease' || 'stable' }}
      SOLO_DIST_DIR: ${{ github.workspace }}/dist
    permissions:
     contents: write
     id-token: write
     attestations: write
     artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.10"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_RC="${{ needs.validate.outputs.prerelease }}"

          if [ "$IS_RC" = "true" ]; then
            RC_NOTES="docs/releases/${TAG}.md"
            BASE_TAG="${TAG%-rc*}"   # 1.2.3-rc1 -> 1.2.3
            BASE_NOTES="docs/releases/${BASE_TAG}.md"

            if [ -f "$RC_NOTES" ]; then
              cp "$RC_NOTES" RELEASE_NOTES.md
              echo "Using RC-specific release notes: $RC_NOTES"
            elif [ -f "$BASE_NOTES" ]; then
              cp "$BASE_NOTES" RELEASE_NOTES.md
              echo "Using base release notes for RC: $BASE_NOTES"
            else
              echo "No release notes found for ${TAG} or ${BASE_TAG}; using fallback."
              echo "Pre-release ${TAG}" > RELEASE_NOTES.md
            fi
          else
            NOTES_FILE="docs/releases/${TAG}.md"
            cp "$NOTES_FILE" RELEASE_NOTES.md
            echo "Using stable release notes: $NOTES_FILE"
          fi
      - name: Generate SHA256 checksums
        run: mise run ci:rel:checksums
      - name: Validate publication inputs
        run: mise run ci:rel:validate-publish-inputs
      # TODO: uncomment when we switch to a public repo
      # - name: Attest release artifacts provenance
      #   uses: actions/attest@v4
      #   with:
      #     subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/**
          fail_on_unmatched_files: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.make_latest == 'true' }}
  dispatch-external:
    needs: [validate, release]
    runs-on: ubuntu-latest
    if: needs.validate.outputs.prerelease != 'true'
    env:
      MISE_ENV: ci
      SOLO_RELEASE_TAG: ${{ github.ref_name }}
      SOLO_RELEASE_VERSION: ${{ github.ref_name }}
      SOLO_RELEASE_CHANNEL: stable
      RELEASE_PACKAGE_NAME: solo
      RELEASE_APP_NAME: Solo
      RELEASE_DESCRIPTION: The lightweight, fast, open-source API client for modern development
      RELEASE_LICENSE: AGPL-3.0-only
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.10"
      - name: Generate external package repos GitHub App token
        id: external_repos_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RAML_DEV_AUTOMATIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.RAML_DEV_AUTOMATIONS_APP_PRIVATE_KEY }}
          owner: raml-dev
          repositories: |
            linux-packages-repos
            homebrew-tap
            scoop-bucket
          permission-contents: write
      - name: Dispatch stable release to external package repos
        env:
          EXTERNAL_REPOS_DISPATCH_TOKEN: ${{ steps.external_repos_app_token.outputs.token }}
        run: mise run ci:rel:dispatch
