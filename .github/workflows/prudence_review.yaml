name: Prudence Code Review
on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/prudence')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prudence Agent
        uses: actions/checkout@v4
        with:
          repository: raml-dev/prudence

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Prudence Review
        run: uv run main.py ${{ github.event.issue.number }}
        env:
          PROVIDER_NAME: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_NAME: "moonshotai/kimi-k2-instruct-0905"
          REPO_NAME: ${{ github.repository }} 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GITHUB_PRIVATE_KEY }}
          GITHUB_INSTALLATION_ID: ${{ secrets.GITHUB_INSTALLATION_ID }}
