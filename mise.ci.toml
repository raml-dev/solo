[tasks."ci:fe:install"]
dir = "{{ config_root }}/frontend"
run = "npm install"

[tasks."ci:fe:lint"]
dir = "{{ config_root }}/frontend"
run = "npm run lint"

[tasks."ci:fe:build"]
dir = "{{ config_root }}/frontend"
depends = "ci:fe:build-wails-module"
run = "npm run build"

[tasks."ci:fe:build-wails-module"]
dir = "{{ config_root }}"
run = """
mkdir -p frontend/dist/assets
touch frontend/dist/index.html
wails generate module
"""

[tasks."ci:fe:check"]
dir = "{{ config_root }}/frontend"
depends = "ci:fe:build"
run = "npm run check"

[tasks."ci:be:build"]
run = "wails build -tags webkit2_41"

[tasks."ci:be:gen-update-config"]
shell = "bash -c"
run = """
set -eu

: "${UPDATE_ENDPOINT:?UPDATE_ENDPOINT is required}"
: "${UPDATE_KID:?UPDATE_KID is required}"
: "${UPDATE_SECRET:?UPDATE_SECRET is required}"

mkdir -p internal/appinfo

cat > internal/appinfo/update_config.json <<EOF
{
  "endpoint": "${UPDATE_ENDPOINT}",
  "kid": "${UPDATE_KID}",
  "secret": "${UPDATE_SECRET}"
}
EOF
"""

[tasks."ci:be:tests"]
run = "go test -v ./..."

# Development task definitions
[tasks."ci:check-license"]
description = "Check license headers in all files"
run = """
addlicense -check -c "raml-dev" -v -s -l GPL-3.0-only -ignore frontend/node_modules/* ./frontend ./internal go.mod go.sum *.go
"""
